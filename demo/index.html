  <body>
    <main id="demo">
      <noscript>
        <h1>Throw</h1>
        <p>
          An FFGL effect that throws your clip onto a real surface the way a
          projector would: brick, corrugated sheet, tread plate, drapes,
          weatherboard, tiles, crumpled paper or a height map of your own. The
          light leaves a lens at a real place in the room and you watch from
          somewhere else, so the picture dims with distance and angle, takes the
          wall's colour, falls into shadow behind the relief and slides over it
          as you move. A projector, not a texture map.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/throw">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/throw/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/throw">Source on GitHub</a></li>
        </ul>
      </noscript>
