name: release

# Build the Throw FFGL effect for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) Throw.bundle
#   - Windows -> x64 Throw.dll (GLEW static-linked via vcpkg)
# Each ships as a zip, with a .dmg for macOS and an installer for Windows.
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
#
# Dispatching this manually is the cheap way to get a Windows build without
# publishing anything: the release job below is gated on refs/tags/v*, so a
# workflow_dispatch run builds both platforms and skips publication. That is
# how a DLL tested on Windows is the one a tag then ships.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 and never macos-13: the Intel macOS runners are retired,
          # so x86_64 is cross-compiled from Apple Silicon. CMakeLists.txt's
          # CMAKE_OSX_ARCHITECTURES does that on its own.
          - { name: macos-universal, os: macos-15 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Tools off: twtest links against zlib and CGL and is a developer
      # harness, not something that ships. Its checks run locally via
      # tools/verify.sh, and the GL-free ones in ci.yml.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTHROW_BUILD_TOOLS=OFF

      # GLEW comes from vcpkg, static-linked (static-md keeps the CRT dynamic
      # so the plugin matches the host) so the .dll has no external
      # glew32.dll runtime dependency.
      #
      # Applocal off: with a static triplet there is no DLL for vcpkg to copy,
      # and isohypse's two plugins once raced each other's copy step to an
      # exit 32. One plugin cannot race, but the step has nothing to do.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DTHROW_BUILD_TOOLS=OFF
          -DVCPKG_APPLOCAL_DEPS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The shipped DLL, loaded as a host loads it: see tools/wincheck.ps1.
      # -Params is the control table plus the About block (its text and four
      # buttons); it changes whenever either does.
      - name: Check the DLL (Windows)
        if: runner.os == 'Windows'
        run: |
          ./tools/wincheck.ps1 -Dll "build/Release/Throw.dll" -Name "SW Throw" -Id TW01 -Kind effect -Params 34
          if( $LASTEXITCODE ) { exit $LASTEXITCODE }

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/Throw.bundle" "out/Throw.bundle"
            # Sanity-check the bundle really is universal and exports plugMain.
            # An arm64-only build logs as a success, and a bundle that exports
            # nothing loads cleanly and reports that it contains no plugins --
            # neither failure is visible anywhere else in this workflow.
            #
            # Actions runs `shell: bash` as `bash -eo pipefail`, so `cmd | grep -q X`
            # FAILS when grep FINDS its match: grep exits at once, the writer takes
            # SIGPIPE, and pipefail reports the pipeline as failed. Captured and
            # matched with `case` instead.
            bin="out/Throw.bundle/Contents/MacOS/Throw"
            __archs=$( lipo -archs "$bin" )
            echo "architectures: $__archs"
            case "$__archs" in
              *x86_64*arm64* | *arm64*x86_64*) ;;
              *) echo "expected x86_64 and arm64, got: $__archs"; exit 1 ;;
            esac
            __symbols=$( nm -gU "$bin" )
            case "$__symbols" in
              *_plugMain*) ;;
              *) echo "expected _plugMain"; exit 1 ;;
            esac
          else
            cp "build/Release/Throw.dll" "out/Throw.dll"
          fi
          # GLEW and the FFGL SDK are BSD-licensed and built into the binary,
          # so their notices travel with it.
          cp ATTRIBUTIONS.md out/
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../throw-${{ matrix.name }}.zip" ./*
          else
            zip -r "../throw-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific -- the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects -- so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users.
        run: |
          source scripts/release-lib.sh
          rl_init "Throw" throw "${{ steps.ver.outputs.version }}" \
            com.stoatworks.throw "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/Throw.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: throw-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded. Its directory page defaults to release-lib's
    # Program Files folder, which Resolume never reads, and stays editable: the
    # user guide tells people to give it Documents\Resolume Arena\Extra Effects
    # (or Avenue's), since Resolume reads plugins from a folder per edition.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Throw" throw "$version" com.stoatworks.throw "$PWD/installers"
          zip="$(find artifacts -name "throw-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --plain: a plugin needs neither a shortcut nor a PATH entry (nib#2:
          # an unguarded PATH write once wiped a system PATH).
          rl_nsis windows-x86_64 "$stage" --plain
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: throw-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
